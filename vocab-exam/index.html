/* ===================== 데이터 가공 ===================== */
const T1 = T1RAW.split("\n").map(l => { const i = l.indexOf(" | "); return { w: l.slice(0, i).trim(), m: l.slice(i + 3).trim() }; });
const cleanMeaning = m => m.replace(/\[(명|동|형|부)\]\s*/g, "").replace(/\s+/g, " ").trim();

function splitMarked(s) { // returns [{t, ans:boolean}]
  const out = []; const re = /\[\[(.+?)\]\]/g; let last = 0, m;
  while ((m = re.exec(s))) { if (m.index > last) out.push({ t: s.slice(last, m.index) }); out.push({ t: m[1], ans: true }); last = re.lastIndex; }
  if (last < s.length) out.push({ t: s.slice(last) });
  return out;
}
function expand(raw, type, hasUnit) {
  const qs = [];
  raw.split("\n").forEach((line, si) => {
    const parts = line.split(" | ");
    const unit = hasUnit ? parts.shift().trim() : "";
    const en = parts[0].trim(), ko = parts[1].trim();
    const segs = splitMarked(en);
    segs.forEach((seg, k) => {
      if (!seg.ans) return;
      const before = segs.slice(0, k).map(s => s.t).join("");
      const after = segs.slice(k + 1).map(s => s.t).join("");
      qs.push({ type, id: `t${type}:${si}:${k}`, unit, before, after, ans: seg.t, ko, full: en.replace(/\[\[|\]\]/g, "") , si });
    });
  });
  return qs;
}
const T2Q = expand(T2RAW, 2, true);
const T3Q = expand(T3RAW, 3, false);

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const CIRC = ["①", "②", "③", "④", "⑤"];
const norm = s => String(s || "").toLowerCase().replace(/[’‘`´]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, " ").trim().replace(/[.?!,]+$/, "").trim();

function store(key, val) { try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null"); localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; } }

function makeT1(idx) {
  const item = T1[idx];
  const correctText = cleanMeaning(item.m);
  const pool = shuffle(T1.map((_, i) => i).filter(i => i !== idx));
  const picks = []; const seen = new Set([correctText]);
  for (const i of pool) { const t = cleanMeaning(T1[i].m); if (!seen.has(t)) { seen.add(t); picks.push(t); } if (picks.length === 4) break; }
  const choices = shuffle([correctText, ...picks]);
  return { type: 1, id: "t1:" + idx, word: item.w, choices, correct: choices.indexOf(correctText), meaning: item.m };
}
function questionFromId(id) {
  if (id.startsWith("t1:")) { const i = +id.slice(3); return T1[i] ? makeT1(i) : null; }
  return (id.startsWith("t2:") ? T2Q : T3Q).find(q => q.id === id) || null;
}
function check(q, val) {
  if (q.type === 1) return val === q.correct;
  if (val == null || !String(val).trim()) return false;
  const a = norm(q.ans), v = norm(val);
  return v === a || norm(q.ans[0] + val) === a;
}
function hint2(ans) { // r _ _ _ _ _ _ _
  return ans.split("").map((c, i) => i === 0 ? c : c === " " ? "  " : c === "-" ? "-" : "_").join(" ").replace(/    /g, "   ");
}

}
function fullWithMark(q) { return `${esc(q.before)}<mark>${esc(q.ans)}</mark>${esc(q.after)}`; }

  const out = [], used = new Set();

}

  const answers = new Array(qs.length).fill(null);
  let left = 600, done = false;

  const sec = (type, title, sub) => `<div class="task-head"><span class="task-tag">Task ${type}</span><h2>${title}</h2><span class="muted small">${sub}</span></div>`;
  let html = `<div class="timerbar"><button class="btn" id="quit">← 나가기</button><span class="clock" id="clock">10:00</span><button class="btn solid" id="submit">제출하고 채점</button></div>
  <div id="result"></div><div class="sheet" id="sheet">`;
  qs.forEach((q, i) => {
    if (i === 0) html += sec(1, "주어진 단어에 가장 적절한 우리말 뜻을 고르시오.", "(총 15문항)");
    if (i === 15) html += sec(2, "우리말 해석을 참고하여 다음 빈칸에 들어갈 가장 적절한 단어를 쓰시오. (단, 철자 개수에 맞게 쓸 것)", "(총 5문항)");
    if (i === 20) html += sec(3, "다음 빈칸에 들어갈 표현을 채워 주어진 우리말 해석에 맞게 영어 문장을 완성하시오. (단, 어법에 맞게 쓸 것)", "(총 5문항)");
    html += `<div class="q" id="q${i}">`;
    if (q.type === 1) {
      html += `<div><span class="qnum">(${i + 1})</span><span class="word">${esc(q.word)}</span></div><div class="choices">` +
        q.choices.map((c, k) => `<button class="choice" data-q="${i}" data-k="${k}"><span class="bubble">${k + 1}</span><span>${esc(c)}</span></button>`).join("") + `</div>`;
    } else if (q.type === 2) {
      html += `<div><span class="qnum">(${i + 1})</span><span class="ko">${esc(q.ko)}</span></div><div class="en">${esc(q.before)}${blankHTML(q)}${esc(q.after)}</div>
        <input class="ans-input" id="in${i}" data-q="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="정답 단어 전체를 쓰세요">`;
    } else {
      html += `<div><span class="qnum">(${i + 1})</span><span class="en">${esc(q.before)}${blankHTML(q)}${esc(q.after)}</span></div><div class="ko">(${esc(q.ko)})</div>
        <input class="ans-input" id="in${i}" data-q="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="빈칸 표현 전체를 쓰세요">`;
    }
    html += `<div class="fb" id="fb${i}"></div></div>`;
  });
  html += `</div><div class="row spread"><button class="btn" id="quit2">← 처음으로</button><button class="btn solid" id="submit2">제출하고 채점</button></div>`;
  app.innerHTML = html;

  app.querySelectorAll(".choice").forEach(b => b.onclick = () => {
    if (done) return;
    const qi = +b.dataset.q, k = +b.dataset.k;
    answers[qi] = k;
    app.querySelectorAll(`.choice[data-q="${qi}"]`).forEach(x => x.classList.toggle("sel", +x.dataset.k === k));
  });
  app.querySelectorAll(".ans-input").forEach(inp => {
    inp.oninput = () => { answers[+inp.dataset.q] = inp.value; };
    inp.onkeydown = e => { if (e.key === "Enter") { const nx = $("#in" + (+inp.dataset.q + 1)); if (nx) nx.focus(); } };
  });

  const clock = $("#clock");
  const tick = () => {
    const m = Math.floor(left / 60), s = left % 60;
    clock.textContent = `${m}:${String(s).padStart(2, "0")}`;
    clock.classList.toggle("low", left <= 60);
    if (left <= 0) { finish(true); return; }
    left--;
  };
  tick(); timerId = setInterval(tick, 1000);

  function finish(timeout) {
    if (done) return; done = true; stopTimer();
    let score = 0; const per = [0, 0, 0];
    qs.forEach((q, i) => {
      const ok = check(q, answers[i]);
      if (ok) { score++; per[q.type - 1]++; delete wrong[q.id]; } else wrong[q.id] = (wrong[q.id] || 0) + 1;
      const fb = $("#fb" + i);
      if (q.type === 1) {
        app.querySelectorAll(`.choice[data-q="${i}"]`).forEach(x => {
          const k = +x.dataset.k; x.disabled = true;
          if (k === q.correct) x.classList.add("right"); else if (k === answers[i]) x.classList.add("wrong");
        });
        if (!ok) fb.innerHTML = `<div class="feedback wrong">${answers[i] == null ? "미응답 · " : ""}정답 ${CIRC[q.correct]} — ${esc(q.word)}: ${esc(q.meaning)}</div>`;
      } else {
        const inp = $("#in" + i); inp.disabled = true; inp.classList.add(ok ? "right" : "wrong");
        fb.innerHTML = ok ? `<div class="feedback right">정답</div>` : `<div class="feedback wrong">정답: <b>${esc(q.ans)}</b><span class="full">${fullWithMark(q)}</span></div>`;
      }
    });
    saveWrong();
    if (!best || score > best.score) { best = { score, date: new Date().toLocaleString("ko-KR") }; store("vx-best", best); }
    app.querySelectorAll("#submit,#submit2").forEach(b => { b.textContent = "새 모의고사"; b.onclick = exam; });
    $("#result").innerHTML = `<div class="sheet">
      <div class="score"><span class="big">${score}<span class="muted" style="font-size:1.4rem"> / 25</span></span>
      <span>${timeout ? "시간 종료로 자동 제출되었습니다." : `남은 시간 ${Math.floor((left + 1) / 60)}분 ${(left + 1) % 60}초에 제출했습니다.`}<br><span class="muted small">틀린 ${25 - score}문항은 오답노트에 저장했습니다.</span></span></div>
      <div class="breakdown"><div>Task 1<br><b>${per[0]} / 15</b></div><div>Task 2<br><b>${per[1]} / 5</b></div><div>Task 3<br><b>${per[2]} / 5</b></div></div>
      <div class="row"><button class="btn solid" id="again">새 모의고사</button><button class="btn" id="home2">처음으로</button></div></div>`;
    $("#again").onclick = exam; $("#home2").onclick = home;
    window.scrollTo(0, 0);
  }
  $("#submit").onclick = () => finish(false);
  $("#submit2").onclick = () => finish(false);
  $("#quit").onclick = home; $("#quit2").onclick = home;
  window.scrollTo(0, 0);
}

/* ===================== 화면: 한 문제씩 연습 ===================== */
function practice(qs, title, isReview) {
  stopTimer();
  if (!qs.length) { home(); return; }
  let i = 0, correct = 0, answered = false;
  const missed = [];

  function render() {
    const q = qs[i]; answered = false;
    const pct = Math.round(i / qs.length * 100);
    let body = "";
    if (q.type === 1) {
      body = `<div><span class="word">${esc(q.word)}</span></div><div class="choices">` +
        q.choices.map((c, k) => `<button class="choice" data-k="${k}"><span class="bubble">${k + 1}</span><span>${esc(c)}</span></button>`).join("") + `</div>`;
    } else if (q.type === 2) {
      body = `<div class="ko">${esc(q.ko)} <span class="muted small">· Unit ${esc(q.unit)}</span></div><div class="en">${esc(q.before)}${blankHTML(q)}${esc(q.after)}</div>
        <div class="row"><input class="ans-input" id="pin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="정답 단어 전체"><button class="btn solid" id="ok">확인</button></div>`;
    } else {
      body = `<div class="en">${esc(q.before)}${blankHTML(q)}${esc(q.after)}</div><div class="ko">(${esc(q.ko)})</div>
        <div class="row"><input class="ans-input" id="pin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="빈칸 표현 전체"><button class="btn solid" id="ok">확인</button></div>`;
    }
    app.innerHTML = `
      <div class="timerbar"><button class="btn" id="quit">← 나가기</button><span class="small"><b>${esc(title)}</b> · <span class="clock" style="font-size:1rem">${i + 1} / ${qs.length}</span> · 정답 ${correct}</span></div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="sheet"><div class="q">${body}<div id="fb"></div></div>
      <div class="row spread"><span class="muted small">${q.type === 1 ? '<span class="kbd">1</span>–<span class="kbd">5</span> 선택 · ' : ""}<span class="kbd">Enter</span> ${q.type === 1 ? "다음" : "확인 / 다음"}</span><button class="btn" id="next" hidden>다음 →</button></div></div>`;
    $("#quit").onclick = summary;
    $("#next").onclick = next;
    if (q.type === 1) app.querySelectorAll(".choice").forEach(b => b.onclick = () => answer(+b.dataset.k));
    else { const inp = $("#pin"); inp.focus(); $("#ok").onclick = () => answer(inp.value); }
  }
  function answer(val) {
    if (answered) return; answered = true;
    const q = qs[i], ok = check(q, val);
    if (ok) { correct++; if (wrong[q.id]) delete wrong[q.id]; }
    else { missed.push(q); wrong[q.id] = (wrong[q.id] || 0) + 1; }
    saveWrong();
    const fb = $("#fb");
    if (q.type === 1) {
      app.querySelectorAll(".choice").forEach(x => { const k = +x.dataset.k; x.disabled = true; if (k === q.correct) x.classList.add("right"); else if (k === val) x.classList.add("wrong"); });
      fb.innerHTML = `<div class="feedback ${ok ? "right" : "wrong"}">${ok ? "정답" : "오답"} — <b>${esc(q.word)}</b>: ${esc(q.meaning)}</div>`;
    } else {
      const inp = $("#pin"); inp.disabled = true; inp.classList.add(ok ? "right" : "wrong"); $("#ok").hidden = true;
      fb.innerHTML = `<div class="feedback ${ok ? "right" : "wrong"}">${ok ? "정답" : `오답 · 정답: <b>${esc(q.ans)}</b>`}<span class="full">${fullWithMark(q)}</span></div>`;
    }
    $("#next").hidden = false; $("#next").focus();
  }
  function next() { i++; if (i >= qs.length) summary(); else render(); }
  function summary() {
    document.onkeydown = null;
    const total = answered ? i + 1 : i;
    app.innerHTML = `<div class="sheet">
      <div class="eyebrow">${esc(title)} 결과</div>
      <div class="score"><span class="big">${correct}<span class="muted" style="font-size:1.4rem"> / ${total}</span></span><span class="muted">${total ? Math.round(correct / total * 100) : 0}% 정답</span></div>
      ${missed.length ? `<h3>틀린 문제 ${missed.length}개</h3><div class="list">${missed.map(q => q.type === 1
        ? `<div class="li"><b>${esc(q.word)}</b><span>${esc(q.meaning)}</span></div>`
        : `<div class="li block"><span>${fullWithMark(q)}</span><span class="muted small">${esc(q.ko)}</span></div>`).join("")}</div>` : `<p>틀린 문제가 없습니다.</p>`}
      <div class="row">${missed.length ? `<button class="btn solid" id="redo">틀린 것만 다시</button>` : ""}<button class="btn" id="home2">처음으로</button></div></div>`;
    if (missed.length) $("#redo").onclick = () => practice(shuffle(missed.map(q => q.type === 1 ? questionFromId(q.id) : q)), title + " · 다시");
    $("#home2").onclick = home;
    window.scrollTo(0, 0);
  }
  document.onkeydown = e => {
    if (!app.querySelector("#fb")) return;
    const q = qs[i];
    if (q.type === 1 && !answered && /^[1-5]$/.test(e.key)) { answer(+e.key - 1); return; }
    if (e.key === "Enter") {
      if (answered) { e.preventDefault(); next(); }
      else if (q.type !== 1 && document.activeElement && document.activeElement.id === "pin") { e.preventDefault(); answer($("#pin").value); }
    }
  };
  render();
}

/* ===================== 화면: 자료 보기 ===================== */
function study(tab) {
  stopTimer(); document.onkeydown = null;
  const tabs = [["t1", `단어장 (${T1.length})`], ["t2", `교과서 예문 (${T2RAW.split("\n").length})`], ["t3", `Quotes (${T3RAW.split("\n").length})`]];
  app.innerHTML = `<div class="row spread"><button class="btn" id="back">← 처음으로</button><div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${k === tab ? "on" : ""}" data-tab="${k}">${l}</button>`).join("")}</div></div>
    <input class="search" id="q" placeholder="영어 또는 우리말로 검색" autocomplete="off">
    <div class="sheet"><div class="list" id="list"></div></div>`;
  $("#back").onclick = home;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => study(b.dataset.tab));
  const markLine = en => esc(en).replace(/\[\[(.+?)\]\]/g, "<mark>$1</mark>");
  const draw = () => {
    const f = $("#q").value.trim().toLowerCase();
    let rows;
    if (tab === "t1") rows = T1.filter(x => !f || x.w.toLowerCase().includes(f) || x.m.includes(f)).map(x => `<div class="li"><b>${esc(x.w)}</b><span>${esc(x.m)}</span></div>`);
    else if (tab === "t2") rows = T2RAW.split("\n").map(l => l.split(" | ")).filter(p => !f || p.join(" ").toLowerCase().includes(f)).map(([u, en, ko]) => `<div class="li block"><span class="eyebrow">Unit ${esc(u)}</span><span>${markLine(en)}</span><span class="muted small">${esc(ko)}</span></div>`);
    else rows = T3RAW.split("\n").map(l => l.split(" | ")).filter(p => !f || p.join(" ").toLowerCase().includes(f)).map(([en, ko]) => `<div class="li block"><span>${markLine(en)}</span><span class="muted small">${esc(ko)}</span></div>`);
    $("#list").innerHTML = rows.length ? rows.join("") : `<p class="muted">검색 결과가 없습니다.</p>`;
  };
  $("#q").oninput = draw; draw();
  window.scrollTo(0, 0);
}

home();
</script>
